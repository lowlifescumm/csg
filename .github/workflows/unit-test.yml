name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
          JWT_SECRET: test-jwt-secret-for-ci-only
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci-only
          NEXTAUTH_URL: http://localhost:5000

      - name: Run API smoke tests
        run: npx jest __tests__/api/smoke.test.js --no-coverage --testTimeout=15000
        env:
          CI: true
          GROQ_API_KEY: test-groq-key-for-ci-only
          JWT_SECRET: test-jwt-secret-for-ci-only
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci-only
          NEXTAUTH_URL: http://localhost:5000
