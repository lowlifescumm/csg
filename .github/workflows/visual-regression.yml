name: Visual Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so snapshot diffs work across branches
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-jwt-secret-for-ci-builds-only
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci-builds-only
          NEXTAUTH_URL: http://localhost:5000
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GROQ_API_KEY: test-groq-api-key
          STRIPE_SECRET_KEY: test-stripe-key
          STRIPE_WEBHOOK_SECRET: test-webhook-secret
          RESEND_API_KEY: test-resend-key
          PINECONE_API_KEY: test-pinecone-key
          PINECONE_INDEX: test-index
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-key
          CLOUDINARY_API_SECRET: test-secret

      - name: Run visual regression tests
        run: npx playwright test --project=visual-regression
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5000

      - name: Upload baseline snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baselines
          path: __tests__/e2e/__snapshots__/
          retention-days: 14

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
