name: Accessibility Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  a11y-axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start dev server (background)
        run: |
          npm run dev &
          npx wait-on http://localhost:5000 --timeout 60000
        env:
          NODE_ENV: development
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
          JWT_SECRET: test-jwt-secret
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:5000
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GROQ_API_KEY: test-groq-api-key

      - name: Run axe-core CLI accessibility tests
        run: npm run test:a11y
        env:
          BASE_URL: http://localhost:5000

      - name: Stop dev server
        if: always()
        run: pkill -f "next dev" || true

  a11y-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright accessibility tests
        run: npm run test:a11y:playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:5000' }}
          CI: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
          JWT_SECRET: test-jwt-secret
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:5000
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GROQ_API_KEY: test-groq-api-key

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start dev server (background)
        run: |
          npm run dev &
          npx wait-on http://localhost:5000 --timeout 60000
        env:
          NODE_ENV: development
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
          JWT_SECRET: test-jwt-secret
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:5000
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GROQ_API_KEY: test-groq-api-key

      - name: Run Lighthouse CI
        run: npx lighthouse http://localhost:5000 --chrome-flags="--headless --no-sandbox --disable-gpu" --output=json --output-path=./lighthouse-report.json --only-categories=accessibility

      - name: Assert WCAG AA compliance
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('./lighthouse-report.json', 'utf8'));
            const score = data.categories.accessibility.score * 100;
            console.log('Accessibility score:', score);
            if (score < 90) {
              console.error('❌ Accessibility score below 90. WCAG AA compliance required.');
              process.exit(1);
            }
            console.log('✅ Accessibility score passes WCAG AA threshold (≥90).');
          "

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7

      - name: Stop dev server
        if: always()
        run: pkill -f "next dev" || true
