workspace: My Workspace

services:
  - type: web
    name: cosmic-spiritual-guide
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-spiritual-guide-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: csg-tarot
      - key: PINECONE_DIM
        value: 1536
      - key: PINECONE_METRIC
        value: cosine
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: cosmic-spiritual-guide-db
    plan: starter

# Cron Jobs
cronJobs:
  - name: transit-monitor
    schedule: "0 * * * *"  # Every hour
    service: cosmic-spiritual-guide
    command: |
      curl ${NEXT_PUBLIC_BASE_URL}/api/cron/transit-monitor \
        -H "Authorization: Bearer ${CRON_SECRET}"
  
  - name: generate-forecasts
    schedule: "0 6 * * *"  # Daily at 6 AM
    service: cosmic-spiritual-guide
    command: |
      curl ${NEXT_PUBLIC_BASE_URL}/api/cron/generate-forecasts \
        -H "Authorization: Bearer ${CRON_SECRET}"
  
  - name: issue-free-daily-credits
    schedule: "0 0 * * *"  # Daily at midnight
    service: cosmic-spiritual-guide
    command: |
      curl -X POST ${NEXT_PUBLIC_BASE_URL}/api/credits/issue-free-daily \
        -H "Authorization: Bearer ${CRON_SECRET}" \
        -H "Content-Type: application/json"