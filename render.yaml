workspace: My Workspace

services:
  - type: web
    name: cosmic-spiritual-guide
    env: node
    plan: starter
    branch: master
    autoDeploy: true
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install && ESLINT=0 npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-spiritual-guide-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: csg-tarot
      - key: PINECONE_DIM
        value: 1536
      - key: PINECONE_METRIC
        value: cosine
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BLOG_API_KEY
        value: csg-content-pipeline-2026-secure-key
      - key: FAL_KEY
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false

      - key: SANITY_API_TOKEN
        sync: false

databases:
  - name: cosmic-spiritual-guide-db
    plan: starter

# Cron Jobs
cronJobs:
  - name: transit-monitor
    schedule: "0 * * * *"  # Every hour
    service: cosmic-spiritual-guide
    command: |
      curl ${NEXT_PUBLIC_BASE_URL}/api/cron/transit-monitor \
        -H "Authorization: Bearer ${CRON_SECRET}"

  - name: generate-forecasts
    schedule: "0 6 * * *"  # Daily at 6 AM
    service: cosmic-spiritual-guide
    command: |
      curl ${NEXT_PUBLIC_BASE_URL}/api/cron/generate-forecasts \
        -H "Authorization: Bearer ${CRON_SECRET}"

  - name: generate-horoscopes
    schedule: "0 5 * * *"  # Daily at 5 AM — pre-generates all 12 signs before users wake up
    service: cosmic-spiritual-guide
    command: |
      curl -X POST ${NEXT_PUBLIC_BASE_URL}/api/cron/horoscopes \
        -H "Authorization: Bearer ${CRON_SECRET}"

  - name: issue-free-daily-credits
    schedule: "0 0 * * *"  # Daily at midnight
    service: cosmic-spiritual-guide
    command: |
      curl -X POST ${NEXT_PUBLIC_BASE_URL}/api/credits/issue-free-daily \
        -H "Authorization: Bearer ${CRON_SECRET}" \
        -H "Content-Type: application/json"

  - name: content-pipeline
    schedule: "0 10 * * *"  # Daily at 10 AM UTC — processes next brief, creates draft post
    service: cosmic-spiritual-guide
    command: |
      curl -X POST ${NEXT_PUBLIC_BASE_URL}/api/cron/content-pipeline \
        -H "Authorization: Bearer ${CRON_SECRET}"

  - name: content-pipeline-publish
    schedule: "0 11 * * 1"  # Every Monday at 11 AM — creates drafts only; publishing requires workflow gates
    service: cosmic-spiritual-guide
    command: |
      curl -X POST "${NEXT_PUBLIC_BASE_URL}/api/cron/content-pipeline?all=1" \
        -H "Authorization: Bearer ${CRON_SECRET}"