<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Spirit Guide - Grimoire Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Spectral:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cover.css">
</head>
<body>

    <div class="cover-page">
        <div class="bg-texture"></div>
        <div class="bg-nebula"></div>
        
        <div class="geo-layer layer-1"></div> <div class="geo-layer layer-2"></div> <div class="geo-layer layer-3"></div> <div class="content-frame">
            
            <div class="brand-sigil">
                <svg viewBox="0 0 50 50" class="sigil-svg">
                    <path d="M25 2 L2 25 L25 48 L48 25 Z M25 10 C15 10 10 25 25 25 C40 25 35 10 25 10 Z" fill="none" stroke="currentColor" stroke-width="1"/>
                </svg>
                <div class="brand-name">COSMIC SPIRIT GUIDE</div>
            </div>

            <div class="report-header">
                <div class="dynamic-field report-type">REPORT TYPE PLACEHOLDER</div>
                <div class="separator-ornament">✦ ✧ ✦</div>
                <h1 class="main-title">The Celestial Blueprint</h1>
            </div>

            <div class="center-ornament"></div>

            <div class="recipient-section">
                <div class="prepared-for">DIVINED EXCLUSIVELY FOR</div>
                <div class="dynamic-field recipient-name">RECIPIENT NAME</div>
                <div class="recipient-underline"></div>
            </div>

            <div class="footer-meta">
                <span class="dynamic-field meta-date">DECEMBER 10, 2025</span>
                <span class="meta-separator">|</span>
                <span class="dynamic-field meta-location">MAZATLAN, MX</span>
            </div>

        </div> <div class="occult-border"></div>
    </div>

</body>
</html>
