<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="goldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4BC"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8941F"/>
    </linearGradient>
    <linearGradient id="violetIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Celestial Eye Icon Only -->
  <g transform="translate(5, 5)">
    <!-- Outer 8-point star -->
    <path d="M25 0 L27 8 L35 5 L30 12 L38 15 L30 18 L35 25 L27 22 L25 30 L23 22 L15 25 L20 18 L12 15 L20 12 L15 5 L23 8 Z" 
          fill="none" 
          stroke="url(#goldIcon)" 
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Eye shape -->
    <path d="M25 10 Q35 15 25 20 Q15 15 25 10" 
          fill="none" 
          stroke="url(#goldIcon)" 
          stroke-width="1.8"
          stroke-linecap="round"/>
    
    <!-- Eye inner almond -->
    <path d="M25 11 Q33 15 25 19 Q17 15 25 11" 
          fill="none" 
          stroke="url(#goldIcon)" 
          stroke-width="1"/>
    
    <!-- Iris - celestial pattern -->
    <circle cx="25" cy="15" r="3.5" 
            fill="none" 
            stroke="url(#violetIcon)" 
            stroke-width="0.8"/>
    
    <!-- Constellation dots in iris -->
    <circle cx="25" cy="15" r="1.5" fill="url(#violetIcon)"/>
    <circle cx="23.5" cy="13.5" r="0.5" fill="url(#goldIcon)"/>
    <circle cx="26.5" cy="13.5" r="0.5" fill="url(#goldIcon)"/>
    <circle cx="23.5" cy="16.5" r="0.5" fill="url(#goldIcon)"/>
    <circle cx="26.5" cy="16.5" r="0.5" fill="url(#goldIcon)"/>
    
    <!-- Crescent moon in pupil -->
    <path d="M25 13.5 Q26.8 15 25 16.5 Q24 15 25 13.5" 
          fill="url(#goldIcon)"/>
    
    <!-- Decorative orbit ring -->
    <ellipse cx="25" cy="15" rx="6" ry="2" 
             fill="none" 
             stroke="url(#violetIcon)" 
             stroke-width="0.4" 
             opacity="0.7"/>
    <ellipse cx="25" cy="15" rx="2" ry="6" 
             fill="none" 
             stroke="url(#violetIcon)" 
             stroke-width="0.4" 
             opacity="0.7"/>
  </g>
</svg>