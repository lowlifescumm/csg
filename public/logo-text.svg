<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .logo-text {
        font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 500;
        font-size: 180px;
        fill: #1a237e;
        letter-spacing: -4px;
      }
      .word-highlight {
        fill: #311b92;
      }
    </style>
  </defs>
  <g aria-label="Cosmic Spiritual Guide" role="img">
    <text x="40" y="220" class="logo-text">Cosmic</text>
    <text x="520" y="220" class="logo-text word-highlight">Spiritual</text>
    <text x="1020" y="220" class="logo-text">Guide</text>
  </g>
</svg>
