<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="irisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pupilGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- All-Seeing Eye -->
  <g transform="translate(10, 10)">
    <!-- Outer triangle/pyramid frame -->
    <path d="M 40 20 L 20 50 L 60 50 Z" 
          fill="url(#eyeGradient)" 
          opacity="0.3"
          filter="url(#glow)"/>
    
    <!-- Eye shape (almond) -->
    <ellipse cx="40" cy="40" rx="25" ry="15" 
             fill="url(#irisGradient)" 
             opacity="0.9"/>
    
    <!-- Iris detail - cosmic swirls -->
    <path d="M 25 40 Q 32 32, 40 40 Q 48 48, 55 40" 
          stroke="#60a5fa" 
          stroke-width="1.5" 
          fill="none" 
          opacity="0.5"/>
    <path d="M 28 35 Q 35 40, 40 35 Q 45 30, 52 35" 
          stroke="#818cf8" 
          stroke-width="1" 
          fill="none" 
          opacity="0.4"/>
    
    <!-- Pupil -->
    <circle cx="40" cy="40" r="8" fill="url(#pupilGradient)"/>
    
    <!-- Highlight on pupil -->
    <ellipse cx="38" cy="36" rx="3" ry="4" fill="#ffffff" opacity="0.8"/>
    
    <!-- Eyelashes/sparkles -->
    <circle cx="25" cy="28" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="35" cy="25" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="45" cy="25" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="55" cy="28" r="1.5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Cosmic rays emanating from eye -->
    <line x1="40" y1="20" x2="40" y2="10" stroke="url(#eyeGradient)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="40" y1="55" x2="40" y2="65" stroke="url(#eyeGradient)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="5" y2="40" stroke="url(#eyeGradient)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="65" y1="40" x2="75" y2="40" stroke="url(#eyeGradient)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Cosmic Spirit Guide -->
  <text x="90" y="60" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif" 
        font-size="32" 
        font-weight="600" 
        fill="#1f1f86" 
        letter-spacing="0.5px">
    Cosmic Spirit Guide
  </text>
</svg>
